app = "mcp-webshop-demo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    CATALOG_MODE = "live"

[env]
  PORT = "3000"
  CATALOG_MODE = "live"
  AI_PROVIDER = "google"
  AI_MODEL = "gemini-3.5-flash"
  CHAT_MAX_OUTPUT_TOKENS = "2048"
  CHAT_TIMEOUT_MS = "30000"
  ENABLE_PUBLIC_MCP_GUARDS = "true"
  MCP_MAX_REQUEST_BYTES = "256000"
  MCP_MAX_REQUESTS_PER_MINUTE = "120"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
